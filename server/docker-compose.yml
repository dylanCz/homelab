services:
  app:
    container_name: doco-cd
    image: ghcr.io/kimdre/doco-cd:0.120.1
    restart: unless-stopped
    ports:
      - "9120:9120"
    environment:
      TZ: Europe/London
      PASS_ENV: "true"
      SOPS_AGE_KEY_FILE: /run/secrets/sops_age_key
      POLL_CONFIG_FILE: /etc/doco-cd/poll.yml
    secrets:
      - sops_age_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./poll.yml:/etc/doco-cd/poll.yml:ro
      - /srv/docker/dococd:/data
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "glance.name=DocoCD"
      - "glance.icon=si:flux"
      - "glance.description=GitOps"
      - "glance.id=dococd"

secrets:
  sops_age_key:
    file: sops_age_key.txt

volumes:
  data:
